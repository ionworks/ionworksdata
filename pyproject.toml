[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ionworksdata"
version = "0.22.0"
description = "Data processing for Ionworks software."
requires-python = ">=3.11"
license = { file = "LICENSE" }
readme = { file = "README.md", content-type = "text/markdown" }
dependencies = [
    "pybamm>=26.9.0.0",
    "iwutil>=0.4.0",
    "polars>=2.1.0",
    "pandas>=2.2.2",
    # Not 2.5: it needs Python 3.12, and requires-python still allows 3.11.
    "numpy>=2.0.0",
    "matplotlib>=3.11.2",
    "scipy>=1.14.0",
    "fastexcel>=0.20.2",
    "ionworks-api>=0.34.0",
    "ionworks-schema>=0.18.0",
    "pytz>=2026.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0",
    "openpyxl",
]
docs = [
    "pydata-sphinx-theme",
    "sphinx-design",
    "myst-nb",
]

[project.urls]
Homepage = "https://ionworks.com"
Documentation = "https://packages.docs.ionworks.com/ionworksdata/"
Repository = "https://github.com/ionworks/ionworks"

[tool.hatch.build.targets.sdist]
only-include = ["ionworksdata", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["ionworksdata"]

[tool.uv.sources]
iwutil = { workspace = true }
ionworks-api = { workspace = true }
ionworks-schema = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore:.*is deprecated and will receive no further releases:FutureWarning"]

[tool.coverage.run]
source = ["ionworksdata"]
